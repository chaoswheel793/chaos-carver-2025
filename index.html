<!DOCTYPE html>
<html>
<head>
  <title>Chaos Carver</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/loaders/GLTFLoader.js"></script>
  <style>
    body {margin:0;background:#000;overflow:hidden;font-family:monospace;color:#ff0044;}
    #ui{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:999;}
    button{font-size:50px;padding:20px;background:#300;border:3px solid #600;color:#f66;}
  </style>
</head>
<body>
  <div id="ui">
    <button>HOLD TO CARVE</button>
  </div>

  <script type="module">
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000);
    const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
    camera.position.set(0,1.4,3.2);
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.HemisphereLight(0xff0044, 0x440044, 1.5);
    scene.add(light);

    const loader = new GLTFLoader();
    loader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/RobotExpressive/RobotExpressive.glb', gltf => {
      const hand = gltf.scene;
      hand.scale.set(1.3,1.3,1.3);
      hand.position.set(0,0.1,0.5);
      hand.rotation.set(-0.7,0,0);
      hand.traverse(n => {
        if (n.isMesh) {
          n.material.color.set(0xff0044);
          n.material.metalness = 0.9;
          n.material.roughness = 0.1;
          n.material.emissive = new THREE.Color(0xff0044);
          n.material.emissiveIntensity = 2;
        }
      });
      scene.add(hand);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
